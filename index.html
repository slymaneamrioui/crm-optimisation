<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com https://maps.googleapis.com https://maps.gstatic.com; connect-src 'self' https://*.googleapis.com https://*.gstatic.com https://recherche-entreprises.api.gouv.fr https://geo.api.gouv.fr wss://*.firebaseio.com; img-src 'self' data: blob: https://tile.openstreetmap.org https://*.googleapis.com https://*.gstatic.com https://*.google.com https://*.googleusercontent.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; frame-src https://crm-optimisation-8d0cc.firebaseapp.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0176d3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CRM Optim">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>CRM Optimisation des coûts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#0b5cab; --brand-2:#0176d3; --brand-soft:#e5f1fb; --ink:#181818; --ink-2:#444; --ink-3:#747474;
  --line:#e5e5e5; --bg:#f3f3f3; --card:#fff; --ok:#2e844a; --warn:#dd7a01; --bad:#ba0517; --violet:#7f56d9; --teal:#06a59a;
  --r:10px; --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px;color:var(--ink);background:var(--bg)}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand-2)}
.app{display:grid;grid-template-columns:220px 1fr;grid-template-rows:56px 1fr;height:100vh}
/* top bar */
.top{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line);position:relative;z-index:20}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;min-width:188px}
.logo-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--brand-2),var(--teal));display:grid;place-items:center;color:#fff;font-size:15px}
.search{flex:1;max-width:620px;position:relative}
.search input{width:100%;padding:9px 12px 9px 36px;border:1px solid #c9c9c9;border-radius:8px;background:#fafafa;outline:none}
.search input:focus{border-color:var(--brand-2);background:#fff;box-shadow:0 0 0 3px var(--brand-soft)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search-results{position:absolute;top:44px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:380px;overflow:auto;display:none}
.search-results.open{display:block}
.sr-item{padding:10px 14px;display:flex;justify-content:space-between;gap:10px;cursor:pointer;border-bottom:1px solid #f2f2f2}
.sr-item:hover,.sr-item.active{background:var(--brand-soft)}
.sr-item small{color:var(--ink-3)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.goal{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);cursor:pointer;user-select:none}
.save-state{font-size:12px;color:var(--ink-3);min-width:110px;text-align:right}
/* nav */
.nav{background:#fff;border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;background:none;border-radius:8px;text-align:left;color:var(--ink-2);font-weight:500}
.nav button:hover{background:#f4f6f9}
.nav button.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav .count{margin-left:auto;background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;font-weight:600}
.nav .sep{height:1px;background:var(--line);margin:10px 4px}
.nav .hint{font-size:12px;color:var(--ink-3);padding:6px 12px;line-height:1.45}
.main{overflow:auto;padding:22px 26px 60px}
.page-h{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.page-h h1{font-size:20px;margin:0}
.page-h .sub{color:var(--ink-3);font-size:13px}
.btn{border:1px solid #c9c9c9;background:#fff;border-radius:8px;padding:8px 14px;font-weight:500;color:var(--ink)}
.btn:hover{background:#f7f7f7}
.btn.primary{background:var(--brand-2);border-color:var(--brand-2);color:#fff}
.btn.primary:hover{background:var(--brand)}
.btn.ghost{border-color:transparent;background:none;color:var(--brand-2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.ml-auto{margin-left:auto}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid #ececec}
.p-map{height:360px;border-radius:12px;overflow:hidden;border:1px solid #e5e5e5;position:relative;z-index:0}
.p-map.drawing{cursor:crosshair;touch-action:none;box-shadow:0 0 0 3px #5b3fd6}
.p-map-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #f0f0f0;font-weight:600}
.card-b{padding:14px 16px}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kpi{padding:16px 18px}
.kpi .l{font-size:12px;color:var(--ink-3);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:26px;font-weight:700;margin-top:6px}
.kpi .s{font-size:12px;color:var(--ink-3);margin-top:2px}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
.list-row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid #f3f3f3;cursor:pointer}
.list-row:hover{background:#fafcff}
.list-row:last-child{border-bottom:0}
.avatar{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.grow{flex:1;min-width:0}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.muted{color:var(--ink-3)}
.small{font-size:12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px}
.tag.late{background:#fde8e8;color:var(--bad)}
.tag.today{background:#fff1dc;color:#9a5300}
.tag.soon{background:#e8f4fd;color:var(--brand)}
.empty{padding:28px 16px;text-align:center;color:var(--ink-3)}
.empty .big{font-size:30px;margin-bottom:6px}
/* pipeline bar */
.pipe-bar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:#eee;margin:6px 0 12px}
.legend{display:flex;flex-wrap:wrap;gap:10px 16px;font-size:12px;color:var(--ink-2)}
/* clients table */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.chip{border:1px solid #d8d8d8;background:#fff;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:500;color:var(--ink-2)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
table.t{width:100%;border-collapse:collapse}
.t th{text-align:left;font-size:12px;color:var(--ink-3);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);background:#fafafa;position:sticky;top:0;cursor:pointer;user-select:none}
.t td{padding:11px 14px;border-bottom:1px solid #f1f1f1;vertical-align:middle}
.t tr.r{cursor:pointer}
.t tr.r:hover td{background:#fafcff}
/* kanban */
.kanban{display:grid;grid-template-columns:repeat(7,minmax(190px,1fr));gap:12px;overflow-x:auto;padding-bottom:10px}
.col{background:#eef1f5;border-radius:12px;padding:10px;min-height:300px;display:flex;flex-direction:column;gap:8px}
.col.drop{outline:2px dashed var(--brand-2);outline-offset:-4px;background:var(--brand-soft)}
.col-h{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;padding:4px 4px 6px}
.col-h .n{margin-left:auto;background:#fff;border-radius:999px;padding:0 8px;font-size:12px;color:var(--ink-2)}
.kcard{background:#fff;border-radius:9px;padding:10px 11px;box-shadow:var(--shadow);cursor:grab;border-left:4px solid var(--c,#999)}
.kcard:active{cursor:grabbing}
.kcard .nm{font-weight:600;font-size:13px}
.kcard .meta{font-size:12px;color:var(--ink-3);margin-top:3px}
/* record */
.rec-head{padding:18px 20px;display:flex;align-items:flex-start;gap:16px}
.rec-head .avatar{width:48px;height:48px;font-size:18px;border-radius:12px}
.rec-title{font-size:21px;font-weight:700;margin:0}
.rec-facts{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:8px;font-size:13px;color:var(--ink-2)}
.rec-facts b{font-weight:600;color:var(--ink-3);font-size:11px;text-transform:uppercase;letter-spacing:.04em;display:block}
.path{display:flex;margin:0 20px 16px;gap:3px}
.path button{flex:1;border:0;padding:9px 6px 9px 18px;background:#e9edf2;color:var(--ink-2);font-size:12px;font-weight:600;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%,12px 50%);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.path button:first-child{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%);border-radius:8px 0 0 8px;padding-left:12px}
.path button.done{background:#c8e6d0;color:#1d5c32}
.path button.cur{background:var(--brand-2);color:#fff}
.path button:hover:not(.cur){filter:brightness(.96)}
.path.lost button{background:#f6d4d4;color:var(--bad)}
.rec-layout{display:grid;grid-template-columns:1fr 330px;gap:16px;margin-top:16px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 12px;overflow-x:auto}
.tabs button{border:0;background:none;padding:12px 12px;font-weight:500;color:var(--ink-2);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand-2);font-weight:600}
.tabs .tb-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-left:6px;vertical-align:middle}
.sec-t{font-size:12px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 10px}
.sec-t:first-child{margin-top:4px}
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 18px}
.f{display:flex;flex-direction:column;gap:4px}
.f.full{grid-column:1/-1}
.f label{font-size:12px;color:var(--ink-3);font-weight:500}
.f input,.f select,.f textarea{border:1px solid #d4d4d4;border-radius:7px;padding:8px 10px;background:#fff;outline:none;width:100%}
.f textarea{min-height:76px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px var(--brand-soft)}
.f .calc{padding:8px 10px;border-radius:7px;background:#f6f8fa;border:1px dashed #d4d9df;font-weight:600;min-height:37px}
.f .calc.alert{background:#fff1dc;border-color:#f3c27a;color:#8a4b00}
.f .calc.danger{background:#fde8e8;border-color:#f1a3a3;color:var(--bad)}
.lines{width:100%;border-collapse:collapse;margin-top:6px}
.lines th{font-size:11px;color:var(--ink-3);text-align:left;font-weight:600;padding:6px 6px;border-bottom:1px solid var(--line)}
.lines td{padding:5px 4px;border-bottom:1px solid #f3f3f3}
.lines input,.lines select{width:100%;border:1px solid #dcdcdc;border-radius:6px;padding:6px 7px;background:#fff}
.lines .num{text-align:right;font-weight:600;white-space:nowrap}
.loss{background:linear-gradient(135deg,#fff5f5,#fff);border:1px solid #f5c2c2;border-radius:10px;padding:14px 16px;display:flex;gap:16px;align-items:center;margin:12px 0}
.loss .v{font-size:22px;font-weight:700;color:var(--bad)}
.side .card{margin-bottom:14px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:13px;border-bottom:1px dashed #eee}
.kv:last-child{border-bottom:0}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{position:relative;padding:0 0 16px 26px}
.timeline li:before{content:"";position:absolute;left:8px;top:22px;bottom:0;width:2px;background:#eaeaea}
.timeline li:last-child:before{display:none}
.tl-ic{position:absolute;left:0;top:2px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:10px;color:#fff}
.alert-strip{display:flex;gap:8px;flex-wrap:wrap;margin:0 20px 14px}
.alert-strip .a{background:#fff1dc;color:#8a4b00;border:1px solid #f7d3a1;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600}
.alert-strip .a.r{background:#fde8e8;color:var(--bad);border-color:#f3b4b4}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(20,30,45,.45);display:none;align-items:flex-start;justify-content:center;padding-top:8vh;z-index:50}
.scrim.open{display:flex}
.modal{background:#fff;border-radius:14px;width:min(640px,94vw);max-height:84vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--line);font-weight:700;font-size:16px;display:flex;align-items:center}
.modal-b{padding:18px 20px}
.modal-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.step{display:flex;gap:12px;margin-bottom:16px}
.step .n{width:26px;height:26px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-weight:700;display:grid;place-items:center;flex:none}
.preview{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:8px}
.preview .kv{padding:7px 12px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#16325c;color:#fff;padding:11px 18px;border-radius:10px;font-weight:500;opacity:0;transition:.25s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.banner{background:#fff1dc;border:1px solid #f3c27a;color:#7a4300;padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:13px}
.ct th{cursor:default}
.ct-h{cursor:pointer}
.ct-h:hover{color:var(--ink)}
.ct-btn{border:1px solid #d4d4d4;background:#fff;border-radius:5px;width:22px;height:20px;padding:0;font-size:11px;line-height:1;color:var(--ink-2);vertical-align:middle}
.ct-btn:hover{border-color:var(--brand-2);color:var(--brand-2)}
.ct-btn.on{background:var(--brand-2);border-color:var(--brand-2);color:#fff}
.ct-menu{position:fixed;z-index:40;width:260px;background:#fff;border:1px solid #d8d8d8;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.16);padding:6px;font-size:13px}
.ct-mi{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px}
.ct-mi:hover{background:var(--brand-soft)}
.ct-sep{height:1px;background:var(--line);margin:5px 2px}
.ct-q{width:100%;border:1px solid #d4d4d4;border-radius:6px;padding:7px 9px;margin:4px 0 6px;outline:none}
.ct-q:focus{border-color:var(--brand-2)}
.ct-list{max-height:230px;overflow:auto;border:1px solid #eee;border-radius:6px;padding:4px}
.ct-v{display:flex;align-items:center;gap:7px;padding:5px 6px;border-radius:5px;cursor:pointer}
.ct-v:hover{background:#f6f8fa}
.ct-foot{display:flex;justify-content:space-between;gap:6px;padding:8px 2px 2px}
canvas#confetti{position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:70;display:none;background:transparent}
.nav-sec{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:8px 12px 4px}
.nav-sec.prosp{color:var(--violet)}
.nav button.pv.on{background:#f1ecfd;color:#5b3cc4}
.nav .count.pc,.tabbar .badge.pc{background:var(--violet)}
#login{position:fixed;inset:0;z-index:80;background:var(--bg);display:none;align-items:center;justify-content:center;padding:16px}
#login .lg-card{background:#fff;border-radius:16px;box-shadow:var(--shadow);border:1px solid #ececec;padding:28px 22px;width:min(380px,100%);text-align:center}
#login h1{font-size:20px;margin:0}
#login .f{text-align:left}
#login input{font-size:16px;padding:11px 12px}

/* ---------- mobile app ---------- */
.tabbar,.recbar{display:none}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:56px 1fr;height:100vh;height:100dvh}
  .top{grid-column:1;padding:0 12px;gap:10px;padding-top:env(safe-area-inset-top)}
  .nav,#newBtn,.save-state{display:none}
  .logo-mark{width:34px;height:34px}
  .search input{padding:10px 12px 10px 34px;font-size:16px;border-radius:999px}
  .search-results{position:fixed;top:60px;left:8px;right:8px;max-height:60vh}
  .main{padding:14px 12px calc(92px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
  .page-h{flex-wrap:wrap;margin-bottom:12px}
  .page-h h1{font-size:22px}
  .page-h [data-new]{display:none}
  .kpis{grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .kpi{padding:12px 14px}.kpi .v{font-size:22px}.kpi .s{font-size:11px}
  .grid2{gap:12px}
  .card-h{padding:12px 14px}
  .list-row{padding:12px 14px;gap:10px;flex-wrap:wrap}
  .list-row>div:last-child{flex-wrap:wrap;justify-content:flex-end;gap:6px}
  .toolbar{flex-wrap:nowrap;overflow-x:auto;margin:0 -12px 12px;padding:0 12px 4px;scrollbar-width:none}
  .toolbar::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;padding:8px 14px;font-size:13px}
  #listQ{display:none}
  .kanban{grid-template-columns:repeat(7,84vw);scroll-snap-type:x mandatory;margin:0 -12px;padding:0 12px 10px}
  .col{scroll-snap-align:center;min-height:55vh}
  .kcard{cursor:pointer}
  .rec-head{flex-wrap:wrap;padding:14px}
  .rec-head>div:last-child{width:100%;justify-content:flex-start!important}
  .rec-head [data-log]{display:none}
  .rec-facts{gap:8px 16px}
  .path{overflow-x:auto;margin:0 14px 14px;scrollbar-width:none}
  .path::-webkit-scrollbar{display:none}
  .path button{flex:none;min-width:128px;padding-top:11px;padding-bottom:11px}
  .alert-strip{margin:0 14px 14px}
  .rec-layout,.grid2{grid-template-columns:minmax(0,1fr)!important;margin-top:12px;gap:12px}
  .rec-layout>*,.grid2>*{min-width:0}
  .tabs{scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
  .f input,.f select,.f textarea,.lines input,.lines select{font-size:16px;padding:10px 12px}
  .scrim{align-items:flex-end;padding-top:0}
  .modal{width:100%;max-height:92dvh;border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom)}
  .modal-f{position:sticky;bottom:0;background:#fff;flex-wrap:wrap}
  .modal-f .btn{flex:1;padding:12px}
  .toast{bottom:calc(96px + env(safe-area-inset-bottom));max-width:92vw;text-align:center}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;align-items:flex-end}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink-3);padding:4px 8px;min-width:62px;position:relative}
  .tabbar button .i{font-size:21px;line-height:1.1;filter:grayscale(1);opacity:.7}
  .tabbar button.on{color:var(--brand)}
  .tabbar button.on .i{filter:none;opacity:1}
  .tabbar .fab{width:56px;height:56px;min-width:56px;border-radius:50%;background:linear-gradient(135deg,var(--brand-2),var(--teal));color:#fff;font-size:30px;font-weight:400;justify-content:center;box-shadow:0 6px 18px rgba(1,118,211,.35);margin-top:-22px}
  .tabbar .badge{position:absolute;top:0;right:10px;background:var(--bad);color:#fff;border-radius:999px;font-size:10px;padding:1px 6px}
  body.on-rec .tabbar{display:none}
  body.on-rec .recbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));gap:8px}
  .recbar a,.recbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 4px;font-size:11px;font-weight:600;color:var(--ink-2);text-decoration:none}
  .recbar .i{font-size:19px}
  .recbar .main-act{background:var(--brand-2);border-color:var(--brand-2);color:#fff}
  .recbar .off{opacity:.35;pointer-events:none}
  .qcall{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#e8f6ec;color:var(--ok);text-decoration:none;font-size:18px;flex:none}
  .mrow-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:5px}
}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2,.rec-layout{grid-template-columns:1fr}}
@media (max-width:760px){.logo span{display:none}.logo{min-width:auto}.form{grid-template-columns:1fr}.goal span{display:none}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo"><div class="logo-mark">€</div><span>CRM Optimisation</span></div>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="Rechercher une entreprise, un contact, une ville, un SIRET, un téléphone…" autocomplete="off">
      <div class="search-results" id="sr"></div>
    </div>
    <div class="top-right">
      <div class="goal" id="goal" title="Objectif d'actions du jour (clic pour le changer)"></div>
      <div class="save-state" id="saveState"></div>
      <button class="btn primary" id="newBtn">+ Nouveau client</button>
    </div>
  </header>
  <nav class="nav" id="nav">
    <div class="nav-sec">CRM clients</div>
    <button data-v="accueil">🏠 Accueil</button>
    <button data-v="clients">🏢 Clients</button>
    <button data-v="pipeline">📊 Pipeline</button>
    <button data-v="relances">⏰ Relances <span class="count" id="navCount" hidden></span></button>
    <button data-v="contrats">📅 Fins de contrat</button>
    <div class="sep"></div>
    <div class="nav-sec prosp">Prospection</div>
    <button data-v="p-recherche" class="pv">🔍 Trouver des prospects</button>
    <button data-v="p-liste" class="pv">📋 Mes prospects <span class="count pc" id="pCount" hidden></span></button>
    <button data-v="p-appels" class="pv">📞 Session d'appels</button>
    <button data-v="p-scripts" class="pv">💬 Scripts et objections</button>
    <button data-v="p-messages" class="pv">✉️ Modèles de messages</button>
    <div class="sep"></div>
    <button data-backup="export">💾 Sauvegarder</button>
    <button data-backup="import">📥 Importer</button>
    <div class="sep"></div>
    <div class="hint">Astuce : glisse les cartes du Pipeline pour changer le statut. Passe un client en « Signé » pour fêter ça 🎉</div>
  </nav>
  <main class="main" id="main"></main>
</div>

<nav class="tabbar" id="tabbar">
  <button data-v="accueil"><span class="i">🏠</span>Accueil</button>
  <button data-v="clients"><span class="i">🏢</span>Clients</button>
  <button class="fab" data-new aria-label="Nouveau client">+</button>
  <button data-v="p-appels" data-group="p-"><span class="i">🎯</span>Prospection<span class="badge pc" id="tabPCount" hidden></span></button>
  <button data-v="relances"><span class="i">⏰</span>Relances<span class="badge" id="tabCount" hidden></span></button>
</nav>
<div class="recbar" id="recbar"></div>
<div class="scrim" id="scrim"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<canvas id="confetti"></canvas>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script src="config.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
<script src="prospection.js"></script>
</body>
</html>
