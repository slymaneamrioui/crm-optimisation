<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0176d3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CRM Optim">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>CRM Optimisation des coûts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#0b5cab; --brand-2:#0176d3; --brand-soft:#e5f1fb; --ink:#181818; --ink-2:#444; --ink-3:#747474;
  --line:#e5e5e5; --bg:#f3f3f3; --card:#fff; --ok:#2e844a; --warn:#dd7a01; --bad:#ba0517; --violet:#7f56d9; --teal:#06a59a;
  --r:10px; --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:14px;color:var(--ink);background:var(--bg)}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand-2)}
.app{display:grid;grid-template-columns:220px 1fr;grid-template-rows:56px 1fr;height:100vh}
/* top bar */
.top{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line);position:relative;z-index:20}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:15px;min-width:188px}
.logo-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--brand-2),var(--teal));display:grid;place-items:center;color:#fff;font-size:15px}
.search{flex:1;max-width:620px;position:relative}
.search input{width:100%;padding:9px 12px 9px 36px;border:1px solid #c9c9c9;border-radius:8px;background:#fafafa;outline:none}
.search input:focus{border-color:var(--brand-2);background:#fff;box-shadow:0 0 0 3px var(--brand-soft)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search-results{position:absolute;top:44px;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.12);max-height:380px;overflow:auto;display:none}
.search-results.open{display:block}
.sr-item{padding:10px 14px;display:flex;justify-content:space-between;gap:10px;cursor:pointer;border-bottom:1px solid #f2f2f2}
.sr-item:hover,.sr-item.active{background:var(--brand-soft)}
.sr-item small{color:var(--ink-3)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.goal{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);cursor:pointer;user-select:none}
.save-state{font-size:12px;color:var(--ink-3);min-width:110px;text-align:right}
/* nav */
.nav{background:#fff;border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;background:none;border-radius:8px;text-align:left;color:var(--ink-2);font-weight:500}
.nav button:hover{background:#f4f6f9}
.nav button.on{background:var(--brand-soft);color:var(--brand);font-weight:600}
.nav .count{margin-left:auto;background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;font-weight:600}
.nav .sep{height:1px;background:var(--line);margin:10px 4px}
.nav .hint{font-size:12px;color:var(--ink-3);padding:6px 12px;line-height:1.45}
.main{overflow:auto;padding:22px 26px 60px}
.page-h{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.page-h h1{font-size:20px;margin:0}
.page-h .sub{color:var(--ink-3);font-size:13px}
.btn{border:1px solid #c9c9c9;background:#fff;border-radius:8px;padding:8px 14px;font-weight:500;color:var(--ink)}
.btn:hover{background:#f7f7f7}
.btn.primary{background:var(--brand-2);border-color:var(--brand-2);color:#fff}
.btn.primary:hover{background:var(--brand)}
.btn.ghost{border-color:transparent;background:none;color:var(--brand-2)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.ml-auto{margin-left:auto}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid #ececec}
.card-h{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid #f0f0f0;font-weight:600}
.card-b{padding:14px 16px}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kpi{padding:16px 18px}
.kpi .l{font-size:12px;color:var(--ink-3);font-weight:500;text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:26px;font-weight:700;margin-top:6px}
.kpi .s{font-size:12px;color:var(--ink-3);margin-top:2px}
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
.list-row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid #f3f3f3;cursor:pointer}
.list-row:hover{background:#fafcff}
.list-row:last-child{border-bottom:0}
.avatar{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.grow{flex:1;min-width:0}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.muted{color:var(--ink-3)}
.small{font-size:12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px}
.tag.late{background:#fde8e8;color:var(--bad)}
.tag.today{background:#fff1dc;color:#9a5300}
.tag.soon{background:#e8f4fd;color:var(--brand)}
.empty{padding:28px 16px;text-align:center;color:var(--ink-3)}
.empty .big{font-size:30px;margin-bottom:6px}
/* pipeline bar */
.pipe-bar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:#eee;margin:6px 0 12px}
.legend{display:flex;flex-wrap:wrap;gap:10px 16px;font-size:12px;color:var(--ink-2)}
/* clients table */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.chip{border:1px solid #d8d8d8;background:#fff;border-radius:999px;padding:5px 12px;font-size:12px;font-weight:500;color:var(--ink-2)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
table.t{width:100%;border-collapse:collapse}
.t th{text-align:left;font-size:12px;color:var(--ink-3);font-weight:600;padding:10px 14px;border-bottom:1px solid var(--line);background:#fafafa;position:sticky;top:0;cursor:pointer;user-select:none}
.t td{padding:11px 14px;border-bottom:1px solid #f1f1f1;vertical-align:middle}
.t tr.r{cursor:pointer}
.t tr.r:hover td{background:#fafcff}
/* kanban */
.kanban{display:grid;grid-template-columns:repeat(7,minmax(190px,1fr));gap:12px;overflow-x:auto;padding-bottom:10px}
.col{background:#eef1f5;border-radius:12px;padding:10px;min-height:300px;display:flex;flex-direction:column;gap:8px}
.col.drop{outline:2px dashed var(--brand-2);outline-offset:-4px;background:var(--brand-soft)}
.col-h{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;padding:4px 4px 6px}
.col-h .n{margin-left:auto;background:#fff;border-radius:999px;padding:0 8px;font-size:12px;color:var(--ink-2)}
.kcard{background:#fff;border-radius:9px;padding:10px 11px;box-shadow:var(--shadow);cursor:grab;border-left:4px solid var(--c,#999)}
.kcard:active{cursor:grabbing}
.kcard .nm{font-weight:600;font-size:13px}
.kcard .meta{font-size:12px;color:var(--ink-3);margin-top:3px}
/* record */
.rec-head{padding:18px 20px;display:flex;align-items:flex-start;gap:16px}
.rec-head .avatar{width:48px;height:48px;font-size:18px;border-radius:12px}
.rec-title{font-size:21px;font-weight:700;margin:0}
.rec-facts{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:8px;font-size:13px;color:var(--ink-2)}
.rec-facts b{font-weight:600;color:var(--ink-3);font-size:11px;text-transform:uppercase;letter-spacing:.04em;display:block}
.path{display:flex;margin:0 20px 16px;gap:3px}
.path button{flex:1;border:0;padding:9px 6px 9px 18px;background:#e9edf2;color:var(--ink-2);font-size:12px;font-weight:600;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%,12px 50%);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.path button:first-child{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 50%,calc(100% - 12px) 100%,0 100%);border-radius:8px 0 0 8px;padding-left:12px}
.path button.done{background:#c8e6d0;color:#1d5c32}
.path button.cur{background:var(--brand-2);color:#fff}
.path button:hover:not(.cur){filter:brightness(.96)}
.path.lost button{background:#f6d4d4;color:var(--bad)}
.rec-layout{display:grid;grid-template-columns:1fr 330px;gap:16px;margin-top:16px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 12px;overflow-x:auto}
.tabs button{border:0;background:none;padding:12px 12px;font-weight:500;color:var(--ink-2);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand-2);font-weight:600}
.tabs .tb-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-left:6px;vertical-align:middle}
.sec-t{font-size:12px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;margin:18px 0 10px}
.sec-t:first-child{margin-top:4px}
.form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 18px}
.f{display:flex;flex-direction:column;gap:4px}
.f.full{grid-column:1/-1}
.f label{font-size:12px;color:var(--ink-3);font-weight:500}
.f input,.f select,.f textarea{border:1px solid #d4d4d4;border-radius:7px;padding:8px 10px;background:#fff;outline:none;width:100%}
.f textarea{min-height:76px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px var(--brand-soft)}
.f .calc{padding:8px 10px;border-radius:7px;background:#f6f8fa;border:1px dashed #d4d9df;font-weight:600;min-height:37px}
.f .calc.alert{background:#fff1dc;border-color:#f3c27a;color:#8a4b00}
.f .calc.danger{background:#fde8e8;border-color:#f1a3a3;color:var(--bad)}
.lines{width:100%;border-collapse:collapse;margin-top:6px}
.lines th{font-size:11px;color:var(--ink-3);text-align:left;font-weight:600;padding:6px 6px;border-bottom:1px solid var(--line)}
.lines td{padding:5px 4px;border-bottom:1px solid #f3f3f3}
.lines input,.lines select{width:100%;border:1px solid #dcdcdc;border-radius:6px;padding:6px 7px;background:#fff}
.lines .num{text-align:right;font-weight:600;white-space:nowrap}
.loss{background:linear-gradient(135deg,#fff5f5,#fff);border:1px solid #f5c2c2;border-radius:10px;padding:14px 16px;display:flex;gap:16px;align-items:center;margin:12px 0}
.loss .v{font-size:22px;font-weight:700;color:var(--bad)}
.side .card{margin-bottom:14px}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:13px;border-bottom:1px dashed #eee}
.kv:last-child{border-bottom:0}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{position:relative;padding:0 0 16px 26px}
.timeline li:before{content:"";position:absolute;left:8px;top:22px;bottom:0;width:2px;background:#eaeaea}
.timeline li:last-child:before{display:none}
.tl-ic{position:absolute;left:0;top:2px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:10px;color:#fff}
.alert-strip{display:flex;gap:8px;flex-wrap:wrap;margin:0 20px 14px}
.alert-strip .a{background:#fff1dc;color:#8a4b00;border:1px solid #f7d3a1;border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600}
.alert-strip .a.r{background:#fde8e8;color:var(--bad);border-color:#f3b4b4}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(20,30,45,.45);display:none;align-items:flex-start;justify-content:center;padding-top:8vh;z-index:50}
.scrim.open{display:flex}
.modal{background:#fff;border-radius:14px;width:min(640px,94vw);max-height:84vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--line);font-weight:700;font-size:16px;display:flex;align-items:center}
.modal-b{padding:18px 20px}
.modal-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.step{display:flex;gap:12px;margin-bottom:16px}
.step .n{width:26px;height:26px;border-radius:50%;background:var(--brand-soft);color:var(--brand);font-weight:700;display:grid;place-items:center;flex:none}
.preview{border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:8px}
.preview .kv{padding:7px 12px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#16325c;color:#fff;padding:11px 18px;border-radius:10px;font-weight:500;opacity:0;transition:.25s;z-index:60;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.banner{background:#fff1dc;border:1px solid #f3c27a;color:#7a4300;padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:13px}
.ct th{cursor:default}
.ct-h{cursor:pointer}
.ct-h:hover{color:var(--ink)}
.ct-btn{border:1px solid #d4d4d4;background:#fff;border-radius:5px;width:22px;height:20px;padding:0;font-size:11px;line-height:1;color:var(--ink-2);vertical-align:middle}
.ct-btn:hover{border-color:var(--brand-2);color:var(--brand-2)}
.ct-btn.on{background:var(--brand-2);border-color:var(--brand-2);color:#fff}
.ct-menu{position:fixed;z-index:40;width:260px;background:#fff;border:1px solid #d8d8d8;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.16);padding:6px;font-size:13px}
.ct-mi{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px}
.ct-mi:hover{background:var(--brand-soft)}
.ct-sep{height:1px;background:var(--line);margin:5px 2px}
.ct-q{width:100%;border:1px solid #d4d4d4;border-radius:6px;padding:7px 9px;margin:4px 0 6px;outline:none}
.ct-q:focus{border-color:var(--brand-2)}
.ct-list{max-height:230px;overflow:auto;border:1px solid #eee;border-radius:6px;padding:4px}
.ct-v{display:flex;align-items:center;gap:7px;padding:5px 6px;border-radius:5px;cursor:pointer}
.ct-v:hover{background:#f6f8fa}
.ct-foot{display:flex;justify-content:space-between;gap:6px;padding:8px 2px 2px}
canvas#confetti{position:fixed;left:0;top:0;width:100vw;height:100vh;pointer-events:none;z-index:70;display:none;background:transparent}
.nav-sec{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:8px 12px 4px}
.nav-sec.prosp{color:var(--violet)}
.nav button.pv.on{background:#f1ecfd;color:#5b3cc4}
.nav .count.pc,.tabbar .badge.pc{background:var(--violet)}
#login{position:fixed;inset:0;z-index:80;background:var(--bg);display:none;align-items:center;justify-content:center;padding:16px}
#login .lg-card{background:#fff;border-radius:16px;box-shadow:var(--shadow);border:1px solid #ececec;padding:28px 22px;width:min(380px,100%);text-align:center}
#login h1{font-size:20px;margin:0}
#login .f{text-align:left}
#login input{font-size:16px;padding:11px 12px}

/* ---------- mobile app ---------- */
.tabbar,.recbar{display:none}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:56px 1fr;height:100vh;height:100dvh}
  .top{grid-column:1;padding:0 12px;gap:10px;padding-top:env(safe-area-inset-top)}
  .nav,#newBtn,.save-state{display:none}
  .logo-mark{width:34px;height:34px}
  .search input{padding:10px 12px 10px 34px;font-size:16px;border-radius:999px}
  .search-results{position:fixed;top:60px;left:8px;right:8px;max-height:60vh}
  .main{padding:14px 12px calc(92px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
  .page-h{flex-wrap:wrap;margin-bottom:12px}
  .page-h h1{font-size:22px}
  .page-h [data-new]{display:none}
  .kpis{grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .kpi{padding:12px 14px}.kpi .v{font-size:22px}.kpi .s{font-size:11px}
  .grid2{gap:12px}
  .card-h{padding:12px 14px}
  .list-row{padding:12px 14px;gap:10px;flex-wrap:wrap}
  .list-row>div:last-child{flex-wrap:wrap;justify-content:flex-end;gap:6px}
  .toolbar{flex-wrap:nowrap;overflow-x:auto;margin:0 -12px 12px;padding:0 12px 4px;scrollbar-width:none}
  .toolbar::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;padding:8px 14px;font-size:13px}
  #listQ{display:none}
  .kanban{grid-template-columns:repeat(7,84vw);scroll-snap-type:x mandatory;margin:0 -12px;padding:0 12px 10px}
  .col{scroll-snap-align:center;min-height:55vh}
  .kcard{cursor:pointer}
  .rec-head{flex-wrap:wrap;padding:14px}
  .rec-head>div:last-child{width:100%;justify-content:flex-start!important}
  .rec-head [data-log]{display:none}
  .rec-facts{gap:8px 16px}
  .path{overflow-x:auto;margin:0 14px 14px;scrollbar-width:none}
  .path::-webkit-scrollbar{display:none}
  .path button{flex:none;min-width:128px;padding-top:11px;padding-bottom:11px}
  .alert-strip{margin:0 14px 14px}
  .rec-layout,.grid2{grid-template-columns:minmax(0,1fr)!important;margin-top:12px;gap:12px}
  .rec-layout>*,.grid2>*{min-width:0}
  .tabs{scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
  .f input,.f select,.f textarea,.lines input,.lines select{font-size:16px;padding:10px 12px}
  .scrim{align-items:flex-end;padding-top:0}
  .modal{width:100%;max-height:92dvh;border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom)}
  .modal-f{position:sticky;bottom:0;background:#fff;flex-wrap:wrap}
  .modal-f .btn{flex:1;padding:12px}
  .toast{bottom:calc(96px + env(safe-area-inset-bottom));max-width:92vw;text-align:center}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));justify-content:space-around;align-items:flex-end}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink-3);padding:4px 8px;min-width:62px;position:relative}
  .tabbar button .i{font-size:21px;line-height:1.1;filter:grayscale(1);opacity:.7}
  .tabbar button.on{color:var(--brand)}
  .tabbar button.on .i{filter:none;opacity:1}
  .tabbar .fab{width:56px;height:56px;min-width:56px;border-radius:50%;background:linear-gradient(135deg,var(--brand-2),var(--teal));color:#fff;font-size:30px;font-weight:400;justify-content:center;box-shadow:0 6px 18px rgba(1,118,211,.35);margin-top:-22px}
  .tabbar .badge{position:absolute;top:0;right:10px;background:var(--bad);color:#fff;border-radius:999px;font-size:10px;padding:1px 6px}
  body.on-rec .tabbar{display:none}
  body.on-rec .recbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));gap:8px}
  .recbar a,.recbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:8px 4px;font-size:11px;font-weight:600;color:var(--ink-2);text-decoration:none}
  .recbar .i{font-size:19px}
  .recbar .main-act{background:var(--brand-2);border-color:var(--brand-2);color:#fff}
  .recbar .off{opacity:.35;pointer-events:none}
  .qcall{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#e8f6ec;color:var(--ok);text-decoration:none;font-size:18px;flex:none}
  .mrow-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:5px}

   Laisse null pour garder les données uniquement sur l'appareil. */
window.FIREBASE_CONFIG = {

  authDomain: "crm-optimisation-8d0cc.firebaseapp.com",

<script>
(function(){
  /* --- stockage local (mode sans Firebase, et ancienne version de l'appli) --- */
  const rid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
  const colls={};
  function localColl(name){
    if(colls[name])return colls[name];
    const KEY=name==="clients"?"crm-optim-clients-v1":"crm-optim-"+name+"-v1";
    let data={};try{data=JSON.parse(localStorage.getItem(KEY)||"{}")||{}}catch(e){data={}}
    const subs=new Set();
    const snap=()=>({docs:Object.entries(data).map(([id,d])=>({id,data:()=>d})),metadata:{fromCache:false}});
    function persist(){try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){const er=new Error("Stockage plein");er.code="quota_exceeded";throw er}}
    function emit(){const s=snap();subs.forEach(f=>{try{f(s)}catch(e){}})}
    addEventListener("storage",e=>{if(e.key===KEY){try{data=JSON.parse(e.newValue||"{}")||{}}catch(_){data={}}emit()}});
    return colls[name]={
      all:()=>data,
      onSnapshot(cb){subs.add(cb);setTimeout(()=>cb(snap()),0);return()=>subs.delete(cb)},
      doc(id){id=id||rid();return{id,
        async set(b){data[id]=JSON.parse(JSON.stringify(b));persist();emit()},
        async delete(){delete data[id];persist();emit()}}}
    };
  }
  const LocalDB={collection:n=>localColl(n||"clients"),all:()=>localColl("clients").all()};
  window.LocalDB=LocalDB;

  let resolveDb;const dbReady=new Promise(r=>resolveDb=r);
  window.claude={use:async n=>n==="db"?dbReady:null};
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));

  if(!window.FIREBASE_CONFIG){resolveDb(LocalDB);return}

  /* --- mode synchronisé : Firebase (connexion + base Firestore) --- */
  const V="10.12.2",B="https://www.gstatic.com/firebasejs/"+V+"/";
  const wait=ms=>new Promise(r=>setTimeout(r,ms));
  (async()=>{
    let A,F,app,auth,fs;
    try{
      const [m1,m2,m3]=await Promise.all([import(B+"firebase-app.js"),import(B+"firebase-auth.js"),import(B+"firebase-firestore.js")]);
      A=m2;F=m3;app=m1.initializeApp(window.FIREBASE_CONFIG);auth=A.getAuth(app);
      try{fs=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})})}catch(e){fs=F.getFirestore(app)}
    }catch(e){LoginUI.show("Impossible de joindre le serveur. Vérifie ta connexion internet puis rouvre l'appli.",true);return}
    window.CRMAuth={
      signIn:(e,p)=>A.signInWithEmailAndPassword(auth,e,p),
      signUp:(e,p)=>A.createUserWithEmailAndPassword(auth,e,p),
      reset:e=>A.sendPasswordResetEmail(auth,e),
      signOut:()=>A.signOut(auth),
      email:()=>auth.currentUser&&auth.currentUser.email
    };
    let current=null;
    A.onAuthStateChanged(auth,user=>{
      if(user){
        if(current&&current!==user.uid){location.reload();return}
        if(!current){current=user.uid;LoginUI.hide();resolveDb(makeAdapter(user.uid))}
      }else{
        if(current){location.reload();return}
        LoginUI.show();
      }
    });
    function makeAdapter(uid){
      const flag="crm-migrated-"+uid;
      function migrate(s){
        let done=null;try{done=localStorage.getItem(flag)}catch(e){}
        if(done)return;
        const L=LocalDB.all(),ids=Object.keys(L);
        const col=F.collection(fs,"users",uid,"clients");
        if(ids.length&&s.size===0){ids.forEach(id=>F.setDoc(F.doc(col,id),L[id]).catch(()=>{}))}
        try{localStorage.setItem(flag,"1")}catch(e){}
      }
      return{collection:(name)=>{const nm=name||"clients";const col=F.collection(fs,"users",uid,nm);return{
        onSnapshot(cb,err){
          return F.onSnapshot(col,s=>{
            if(nm==="clients"&&!s.metadata.fromCache)migrate(s);
            cb({docs:s.docs.map(d=>({id:d.id,data:()=>d.data()})),metadata:{fromCache:s.metadata.fromCache}});
          },err);
        },
        doc(id){
          const ref=id?F.doc(col,id):F.doc(col);
          return{id:ref.id,
            // l'écriture est gardée sur l'appareil tout de suite, puis envoyée au serveur dès que le réseau est là
            set(b){const p=F.setDoc(ref,b);p.catch(e=>console.warn("Synchronisation refusée",e));return Promise.race([p,wait(400)])},
            delete(){const p=F.deleteDoc(ref);return Promise.race([p,wait(400)])}};
        }
      }}};
    }
  })();
})();

          <button type="button" class="btn ghost sm" style="margin-top:10px" id="lgReset">Mot de passe oublié ?</button>
        </form></div>`;
      document.body.appendChild(el);
      const f=el.querySelector("#lgf"),m=el.querySelector("#lgMsg");
      const err=c=>({"auth/invalid-credential":"Courriel ou mot de passe incorrect.","auth/wrong-password":"Courriel ou mot de passe incorrect.","auth/user-not-found":"Aucun compte avec ce courriel. Touche « Créer mon compte ».","auth/email-already-in-use":"Un compte existe déjà avec ce courriel. Touche « Se connecter ».","auth/weak-password":"Mot de passe trop court (6 caractères minimum).","auth/invalid-email":"Courriel invalide.","auth/network-request-failed":"Pas de réseau. Réessaie quand tu es connecté.","auth/too-many-requests":"Trop d'essais. Réessaie dans quelques minutes."}[c]||"Erreur : "+c);
      f.addEventListener("submit",async e=>{e.preventDefault();if(!window.CRMAuth)return;
        const em=f.e.value.trim(),pw=f.p.value,up=e.submitter&&e.submitter.name==="up";

        try{up?await CRMAuth.signUp(em,pw):await CRMAuth.signIn(em,pw)}catch(x){m.style.color="var(--bad)";m.textContent=err(x.code)}});
      el.querySelector("#lgReset").onclick=async()=>{const em=f.e.value.trim();if(!em){m.style.color="var(--bad)";m.textContent="Écris ton courriel d'abord.";return}
        try{await CRMAuth.reset(em);m.style.color="var(--ok)";m.textContent="Courriel de réinitialisation envoyé."}catch(x){m.style.color="var(--bad)";m.textContent=err(x.code)}};
    }
    el.style.display="flex";
    const m=el.querySelector("#lgMsg");m.textContent=msg||"";m.style.color="var(--bad)";
    el.querySelector("#lgf").style.display=fatal?"none":"";
  },
  hide(){const el=document.getElementById("login");if(el)el.style.display="none"}
};

function blanchCalc(b){const lines=(b&&b.lignes)||[];let mens=0,perdu=0;lines.forEach(l=>{const q=num(l.qteFact),u=num(l.qteUtil),p=num(l.prix);if(q!=null&&p!=null)mens+=q*p;if(q!=null&&u!=null&&p!=null)perdu+=Math.max(0,q-u)*p});return{mens,perdu}}
function economies(c){let s=0;["elec","gaz","telecom"].forEach(k=>s+=num(c[k]&&c[k].economie)||0);s+=blanchCalc(c.blanch).perdu*12;return s}
function contractAlerts(c){const out=[];Object.entries(LEVIERS).forEach(([k,L])=>{const o=c[k];if(!o)return;const lim=k==="marketing"?(o.finContrat||null):limiteOf(o);if(!lim)return;const d=daysFrom(lim);out.push({k,l:L.l,ic:L.ic,lim,d,fin:o.finContrat})});return out}

/* ---------- db ---------- */
async function init(){
  render();
  const timer=setTimeout(()=>{if(!loaded){$("#saveState").textContent="Connexion lente…";}},10000);
  try{db=await claude.use("db")}catch(e){db=null}
  if(!db){clearTimeout(timer);loaded=true;canWrite=false;render();return}
  try{const u=await claude.use("user");if(u&&u.can){const w=await u.can("data.write");if(w===false)canWrite=false}}catch(e){}
  unsub=db.collection("clients").onSnapshot(snap=>{
    clearTimeout(timer);
    const next=new Map();
    snap.docs.forEach(d=>{const id=d.id;if(dirty.has(id)&&clients.has(id))next.set(id,clients.get(id));else next.set(id,{...JSON.parse(JSON.stringify(d.data()||{})),id})});
    clients=next; loaded=true;
    if(!snap.metadata.fromCache)$("#saveState").textContent=$("#saveState").textContent==="Connexion lente…"?"":$("#saveState").textContent;
    softRender();
  },err=>{clearTimeout(timer);loaded=true;$("#saveState").textContent="Données inaccessibles";render()});
}
const dirty=new Set(); const timers={}; const writing={}; const ver={};
function scheduleSave(id){dirty.add(id);ver[id]=(ver[id]||0)+1;clearTimeout(timers[id]);$("#saveState").textContent="Enregistrement…";timers[id]=setTimeout(()=>flush(id),650)}
async function flush(id){
  if(writing[id]){timers[id]=setTimeout(()=>flush(id),300);return}
  const c=clients.get(id);if(!c||!db)return;
  writing[id]=true;const v0=ver[id];const body=JSON.parse(JSON.stringify(c));delete body.id;body.updatedAt=new Date().toISOString();
  try{await db.collection("clients").doc(id).set(body);$("#saveState").textContent="✓ Enregistré"}
  catch(e){$("#saveState").textContent=e&&e.code==="quota_exceeded"?"Base pleine":"⚠ Non enregistré";if(e&&e.code==="invalid_argument"){canWrite=false;toast("Tu n'as pas les droits de modification sur ce CRM.")}}
  writing[id]=false;if(ver[id]===v0)dirty.delete(id);
}
async function saveNow(id){clearTimeout(timers[id]);dirty.add(id);ver[id]=(ver[id]||0)+1;await flush(id)}

/* ---------- render ---------- */
function softRender(){
  // re-render unless user is typing inside the record form
  const a=document.activeElement;
  if($("#ctMenu")){renderNav();renderGoal();return}
  if(state.view==="record"&&a&&a.closest&&a.closest("#recBody")&&["INPUT","TEXTAREA","SELECT"].includes(a.tagName)){renderNav();renderGoal();return}
  if(state.view.startsWith("p-")&&a&&a.closest&&a.closest("#main")&&["INPUT","TEXTAREA","SELECT"].includes(a.tagName)){renderNav();renderGoal();return}
  if($("#scrim").classList.contains("open")&&state.view.startsWith("p-")){renderNav();renderGoal();return}
  render();
}
function render(){
  closeCtMenu();renderNav();renderGoal();
  document.body.classList.toggle("on-rec",state.view==="record");
  const m=$("#main");
  if(!loaded){m.innerHTML=`<div class="empty"><div class="big">⏳</div>Chargement de ton CRM…</div>`;return}
  if(!db){m.innerHTML=`<div class="banner">Le stockage de ton navigateur est bloqué. Désactive la navigation privée pour utiliser l'application.</div>`;return}
  const v=state.view;
  if(v==="record")return renderRecord();
  if(v==="clients")return renderClients();

}

/* ---------- interactions ---------- */
document.addEventListener("click",e=>{
  if(e.target.closest('a[href^="tel:"],a[href^="sms:"],a[href^="mailto:"]'))return;
  const t=e.target.closest("[data-go],[data-open],[data-new],[data-filter],[data-sort],[data-tab],[data-st],[data-log],[data-done],[data-quick],[data-addline],[data-rmline],[data-del],[data-societe],#nav button[data-v],#tabbar button[data-v]");
  if(!t)return;
  if(t.matches("#nav button[data-v],#tabbar button[data-v]")||t.dataset.go){go(t.dataset.v||t.dataset.go);return}
  if(t.dataset.done){openLog(t.dataset.done);return}
  if(t.hasAttribute("data-new")){openNew();return}
  if(t.dataset.filter){state.filter=t.dataset.filter;renderClients();return}
  if(t.dataset.sort){state.sort=t.dataset.sort;renderClients();return}
  if(t.dataset.open&&!t.matches("[data-tab]")){openRec(t.dataset.open);return}
  if(t.dataset.open&&t.dataset.tab){openRec(t.dataset.open,t.dataset.tab);return}
  const c=clients.get(state.recId);
  if(t.dataset.tab){state.tab=t.dataset.tab;renderRecord();return}
  if(!c)return;
  if(t.dataset.st){setStatut(c.id,t.dataset.st);return}
  if(t.hasAttribute("data-log")){openLog(c.id);return}
  if(t.dataset.quick){c.prochaineRelance=addDays(todayStr(),+t.dataset.quick);if(!c.actionRelance)c.actionRelance="Rappeler";scheduleSave(c.id);renderRecord();toast("Relance programmée le "+fdate(c.prochaineRelance));return}
  if(t.hasAttribute("data-addline")){c.blanch=c.blanch||{};c.blanch.lignes=[...(c.blanch.lignes||[]),{poste:"",qteFact:"",qteUtil:"",prix:""}];scheduleSave(c.id);renderRecord();return}
  if(t.dataset.rmline!=null){c.blanch.lignes.splice(+t.dataset.rmline,1);scheduleSave(c.id);renderRecord();return}
  if(t.hasAttribute("data-del")){confirmDel(c);return}
  if(t.hasAttribute("data-societe")){openSociete(c.id);return}
});

let rrT;function renderRecordLater(){clearTimeout(rrT);rrT=setTimeout(()=>{const a=document.activeElement;if(a&&a.closest&&a.closest("#recBody")&&a.tagName!=="SELECT")return;const sx=$("#main").scrollTop;renderRecord();$("#main").scrollTop=sx},400)}
document.addEventListener("focusout",e=>{if(e.target.closest&&e.target.closest("#recBody"))renderRecordLater()});

function go(v){state.view=v;state.recId=null;try{history.replaceState(null,"","#"+v)}catch(e){}render();$("#main").scrollTop=0}
function openRec(id,tab){state.view="record";state.recId=id;state.tab=tab||"infos";render();$("#main").scrollTop=0;closeSearch()}
window.addEventListener("hashchange",()=>{const h=location.hash.slice(1);if((["accueil","clients","pipeline","relances","contrats"].includes(h)||/^p-(recherche|liste|appels|scripts|messages)$/.test(h))&&state.view!==h){state.view=h;render()}});
$("#newBtn").onclick=()=>openNew();
$("#goal").onclick=()=>openGoal();

/* search */
const qi=$("#q"),sr=$("#sr");let srIdx=0,srList=[];
qi.addEventListener("input",()=>{const q=qi.value.trim();if(!q){closeSearch();return}srList=list().filter(c=>matches(c,q)).slice(0,8);srIdx=0;drawSR(q)});
qi.addEventListener("keydown",e=>{if(!sr.classList.contains("open"))return;if(e.key==="ArrowDown"){srIdx=Math.min(srIdx+1,srList.length);drawSR(qi.value.trim());e.preventDefault()}else if(e.key==="ArrowUp"){srIdx=Math.max(srIdx-1,0);drawSR(qi.value.trim());e.preventDefault()}else if(e.key==="Enter"){if(srIdx<srList.length)openRec(srList[srIdx].id);else openNew(qi.value.trim());qi.value="";closeSearch()}else if(e.key==="Escape")closeSearch()});
function drawSR(q){sr.innerHTML=srList.map((c,i)=>`<div class="sr-item ${i===srIdx?"active":""}" data-sri="${i}"><div><b>${esc(c.societe||"Sans nom")}</b><br><small>${esc([c.prenom,c.nom].filter(Boolean).join(" "))}${c.ville?" · "+esc(c.ville):""}${c.siret?" · "+esc(c.siret):""}</small></div>${pill(c.statut||"À contacter")}</div>`).join("")+(canWrite?`<div class="sr-item ${srIdx===srList.length?"active":""}" data-sri="new"><div>➕ Créer <b>« ${esc(q)} »</b> et chercher sur societe.com</div></div>`:"");sr.classList.add("open")}
sr.addEventListener("mousedown",e=>{const it=e.target.closest("[data-sri]");if(!it)return;e.preventDefault();if(it.dataset.sri==="new")openNew(qi.value.trim());else openRec(srList[+it.dataset.sri].id);qi.value="";closeSearch()});
function closeSearch(){sr.classList.remove("open")}
qi.addEventListener("blur",()=>setTimeout(closeSearch,150));
document.addEventListener("keydown",e=>{if((e.key==="/"||(e.key==="k"&&(e.metaKey||e.ctrlKey)))&&!["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName)){e.preventDefault();qi.focus()}if(e.key==="Escape")closeModal()});

/* ---------- modals ---------- */
function openModal(h){$("#modal").innerHTML=h;$("#scrim").classList.add("open");const f=$("#modal").querySelector("input,textarea");if(f)setTimeout(()=>f.focus(),30)}
function closeModal(){$("#scrim").classList.remove("open")}
$("#scrim").addEventListener("mousedown",e=>{if(e.target.id==="scrim")closeModal()});
$("#modal").addEventListener("click",e=>{if(e.target.closest("[data-close]"))closeModal()});

function openNew(prefill){
  if(!canWrite){toast("Lecture seule");return}
  openModal(`<div class="modal-h">Nouveau client</div><form id="nf"><div class="modal-b"><div class="form">
   <div class="f full"><label>Nom de l'entreprise *</label><input name="societe" required value="${esc(prefill||"")}" placeholder="Ex. Boulangerie Dupont"></div>
   <div class="f"><label>Prénom</label><input name="prenom"></div><div class="f"><label>Nom</label><input name="nom"></div>
   <div class="f"><label>Téléphone</label><input name="tel"></div><div class="f"><label>Email</label><input name="email" type="email"></div>
   <div class="f"><label>Ville</label><input name="ville"></div><div class="f"><label>Source</label><select name="source"><option></option>${SOURCES.map(s=>`<option>${esc(s)}</option>`).join("")}</select></div>
  </div></div><div class="modal-f"><button type="button" class="btn" data-close>Annuler</button><button type="submit" class="btn" name="plain">Créer</button><button type="submit" class="btn primary" name="soc">Créer et chercher sur societe.com</button></div></form>`);
  $("#nf").addEventListener("submit",async e=>{e.preventDefault();const fd=new FormData(e.target);const withSoc=e.submitter&&e.submitter.name==="soc";
    const data={statut:"À contacter",createdAt:new Date().toISOString(),activites:[]};for(const [k,v] of fd.entries())if(v)data[k]=v;
    const ref=db.collection("clients").doc();data.id=ref.id;clients.set(ref.id,data);closeModal();await saveNow(ref.id);
    toast("✨ "+data.societe+" ajouté");openRec(ref.id);if(withSoc)openSociete(ref.id)});
}
function openLog(id){
  const c=clients.get(id);if(!c)return;
  openModal(`<div class="modal-h">Noter un échange · ${esc(c.societe||"")}</div><form id="lf"><div class="modal-b"><div class="form">
   <div class="f"><label>Date</label><input type="date" name="date" value="${todayStr()}"></div>
   <div class="f"><label>Canal</label><select name="canal">${CANAUX.map(x=>`<option>${x}</option>`).join("")}</select></div>
   <div class="f full"><label>Résumé de l'échange</label><textarea name="resume" placeholder="Ce qui s'est dit, ce qu'il attend…"></textarea></div>
   <div class="f"><label>Prochaine action</label><input name="suite" value="${esc(c.actionRelance||"")}" placeholder="Ex. Envoyer la proposition"></div>
   <div class="f"><label>Date de la prochaine relance</label><input type="date" name="dateSuite" value="${addDays(todayStr(),3)}"></div>
   <div class="f full"><label>Nouveau statut</label><select name="statut">${STATUTS.map(s=>`<option ${s.k===(c.statut||"À contacter")?"selected":""}>${esc(s.k)}</option>`).join("")}</select></div>
  </div></div><div class="modal-f"><button type="button" class="btn" data-close>Annuler</button><button class="btn primary">Enregistrer</button></div></form>`);
  $("#lf").addEventListener("submit",e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target).entries());
    c.activites=[...(c.activites||[]),{date:f.date,canal:f.canal,resume:f.resume,suite:f.suite,dateSuite:f.dateSuite,ts:Date.now()}];
    c.dernierContact=f.date;if(f.dateSuite){c.prochaineRelance=f.dateSuite;c.actionRelance=f.suite||c.actionRelance}
    const wasSigned=c.statut==="Signé";c.statut=f.statut;scheduleSave(c.id);closeModal();render();
    const g=parseInt(store("crm-goal")||"10")||10,n=goalCount();
    if(f.statut==="Signé"&&!wasSigned){confetti();toast("🎉 Bravo ! "+(c.societe||"")+" est signé !")}
    else if(n===g){confetti();toast("🔥 Objectif du jour atteint : "+g+" actions !")}
    else toast("✓ Échange noté · "+n+"/"+g+" aujourd'hui")});
}
function openGoal(){
  const g=parseInt(store("crm-goal")||"10")||10;
  openModal(`<div class="modal-h">Objectif du jour</div><form id="gf"><div class="modal-b"><div class="f"><label>Nombre d'échanges à noter par jour</label><input name="g" type="number" min="1" value="${g}"></div><p class="small muted">Chaque échange noté (appel, email, visite…) fait avancer l'anneau en haut à droite.</p></div><div class="modal-f"><button type="button" class="btn" data-close>Annuler</button><button class="btn primary">OK</button></div></form>`);
  $("#gf").addEventListener("submit",e=>{e.preventDefault();store("crm-goal",String(Math.max(1,parseInt(new FormData(e.target).get("g"))||10)));closeModal();renderGoal()});
}
function confirmDel(c){
  openModal(`<div class="modal-h">Supprimer ${esc(c.societe||"ce client")} ?</div><div class="modal-b">La fiche, les découvertes et l'historique des échanges seront supprimés définitivement.</div><div class="modal-f"><button class="btn" data-close>Annuler</button><button class="btn primary" style="background:var(--bad);border-color:var(--bad)" id="doDel">Supprimer</button></div>`);
  $("#doDel").onclick=async()=>{closeModal();try{await db.collection("clients").doc(c.id).delete();clients.delete(c.id);toast("Client supprimé");go("clients")}catch(e){toast("Suppression impossible")}};
}

/* societe.com import */
let sample=null;
async function getSample(){if(sample!==null)return sample;try{sample=await claude.use("sample")}catch(e){sample=null}return sample}
function openSociete(id){
  const c0=clients.get(id);if(c0){window.open("https://www.societe.com/cgi-bin/search?champs="+encodeURIComponent((c0.societe||"")+(c0.ville?" "+c0.ville:"")),"_blank","noopener");toast("Recopie les infos dans l'onglet Infos");}
  return;
  const c=clients.get(id);if(!c)return;
  const q=encodeURIComponent((c.societe||"")+(c.ville?" "+c.ville:""));
  openModal(`<div class="modal-h">🔎 Chercher sur societe.com</div><div class="modal-b">
   <div class="step"><div class="n">1</div><div><b>Ouvre la fiche de l'entreprise</b><div class="small muted" style="margin:4px 0 8px">Choisis la bonne entreprise dans les résultats et ouvre sa fiche.</div><a class="btn" href="https://www.societe.com/cgi-bin/search?champs=${q}" target="_blank" rel="noopener">Ouvrir societe.com ↗</a></div></div>
   <div class="step"><div class="n">2</div><div style="flex:1"><b>Copie toute la page et colle-la ici</b><div class="small muted" style="margin:4px 0 8px">Sur la fiche : Ctrl+A puis Ctrl+C (Cmd sur Mac). Ensuite clique dans la zone et Ctrl+V.</div><textarea id="socTxt" style="width:100%;min-height:120px;border:1px solid #d4d4d4;border-radius:8px;padding:8px" placeholder="Colle ici le contenu de la page societe.com…"></textarea></div></div>
   <div class="step"><div class="n">3</div><div style="flex:1"><b>Claude remplit la fiche</b><div class="small muted" style="margin:4px 0 8px">Seules les informations présentes dans le texte collé sont utilisées. Tu vérifies avant d'appliquer.</div><button class="btn primary" id="socGo">✨ Extraire les infos</button><div id="socOut"></div></div></div>
  </div><div class="modal-f"><button class="btn" data-close>Fermer</button></div>`);
  $("#socGo").onclick=async()=>{
    const txt=$("#socTxt").value.trim();const out=$("#socOut");
    if(txt.length<80){out.innerHTML=`<div class="banner" style="margin-top:10px">Colle d'abord le contenu de la fiche societe.com.</div>`;return}
    const s=await getSample();
    if(!s){out.innerHTML=`<div class="banner" style="margin-top:10px">L'extraction automatique n'est pas disponible ici. Recopie les infos dans l'onglet Infos.</div>`;return}
    $("#socGo").disabled=true;out.innerHTML=`<div class="muted" style="margin-top:10px">⏳ Claude lit la fiche…</div>`;
    const keys={societe:"dénomination / nom commercial",siren:"SIREN (9 chiffres)",siret:"SIRET du siège (14 chiffres)",formeJuridique:"forme juridique (SAS, SARL…)",naf:"code NAF/APE",activite:"libellé de l'activité",dateCreation:"date de création au format AAAA-MM-JJ",effectif:"tranche d'effectif",capital:"capital social",dirigeants:"dirigeant(s) avec leur fonction, séparés par des virgules",adresse:"adresse du siège (numéro et rue)",cp:"code postal",ville:"ville",tel:"téléphone de l'entreprise",email:"email de l'entreprise",urlSite:"site internet"};
    const prompt=`Tu extrais des informations d'entreprise à partir d'un texte copié depuis une fiche du site societe.com.
Règles : utilise UNIQUEMENT ce qui est écrit dans le texte. N'invente rien, ne devine rien, ne complète pas avec tes connaissances. Si une information n'apparaît pas clairement, mets null. Si le texte n'est pas une fiche d'entreprise, renvoie tous les champs à null.
Réponds uniquement avec un objet JSON ayant exactement ces clés :
${Object.entries(keys).map(([k,v])=>`- "${k}": ${v}`).join("\n")}

Texte copié :
<<<
${txt.slice(0,18000)}
>>>`;
    let val=null;
    try{
      if(s.json){val=await s.json(prompt,{modelTier:"default"})}
      else{const r=await s(prompt,{modelTier:"default"});const m=(r.text||"").match(/\{[\s\S]*\}/);val=m?JSON.parse(m[0]):null}
    }catch(e){$("#socGo").disabled=false;out.innerHTML=`<div class="banner" style="margin-top:10px">${e&&e.code==="not_granted"?"Autorise Claude à lire le texte pour utiliser cette fonction.":e&&e.code==="rate_limited"?"Trop de demandes, réessaie dans une minute.":"L'extraction a échoué. Réessaie ou remplis à la main."}</div>`;return}
    $("#socGo").disabled=false;
    const found=Object.keys(keys).filter(k=>val&&val[k]!=null&&String(val[k]).trim()!=="");
    if(!found.length){out.innerHTML=`<div class="banner" style="margin-top:10px">Aucune information trouvée dans ce texte. Vérifie que tu as copié la fiche de l'entreprise.</div>`;return}
    const label=k=>({urlSite:"Site internet"}[k]||(INFOS.find(f=>f.k===k)||{}).l||k);
    out.innerHTML=`<div class="preview">${found.map(k=>`<label class="kv" style="align-items:center"><span><input type="checkbox" data-take="${k}" checked> ${esc(label(k))}</span><b style="text-align:right;max-width:60%">${esc(val[k])}</b></label>`).join("")}</div><button class="btn primary" id="socApply" style="margin-top:10px">Appliquer à la fiche</button>`;
    $("#socApply").onclick=()=>{const cc=clients.get(id);document.querySelectorAll("[data-take]").forEach(cb=>{if(!cb.checked)return;const k=cb.dataset.take;let v=String(val[k]).trim();if(k==="urlSite"){cc.marketing=cc.marketing||{};cc.marketing.urlSite=v;if(!cc.marketing.site)cc.marketing.site="Oui"}else if(k==="dateCreation"){if(/^\d{4}-\d{2}-\d{2}$/.test(v))cc[k]=v}else cc[k]=v});
      saveNow(id);closeModal();state.tab="infos";renderRecord();confetti(40);toast("✓ Fiche remplie depuis societe.com")};
  };
}

/* sauvegarde */
function exportData(){
  const payload={app:"crm-optimisation",version:1,exportedAt:new Date().toISOString(),clients:Object.fromEntries(list().map(c=>{const x={...c};delete x.id;return[c.id,x]}))};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:"application/json"});
  const name="crm-sauvegarde-"+todayStr()+".json";
  const f=typeof File==="function"?new File([blob],name,{type:"application/json"}):null;
  const done=()=>{store("crm-last-export",todayStr());render();toast("✓ Sauvegarde créée")};
  if(isM()&&f&&navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:name}).then(done).catch(()=>{});return}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);done();
}
$("#importFile").addEventListener("change",async e=>{
  const file=e.target.files[0];e.target.value="";if(!file)return;
  try{const j=JSON.parse(await file.text());let obj=j&&j.clients?j.clients:j;
    if(Array.isArray(obj))obj=Object.fromEntries(obj.map(c=>[c.id||Math.random().toString(36).slice(2),c]));
    if(!obj||typeof obj!=="object")throw 0;
    const ents=Object.entries(obj).filter(([id,d])=>d&&typeof d==="object");for(const [id,d] of ents){const x={...d};delete x.id;await db.collection("clients").doc(String(id)).set(x)}const n=ents.length;toast("📥 "+n+" client"+(n>1?"s":"")+" importé"+(n>1?"s":""));go("clients");
  }catch(err){toast("Fichier non reconnu")}
});
document.addEventListener("click",e=>{const b=e.target.closest("[data-backup]");if(!b)return;if(b.dataset.backup==="export")exportData();else if(b.dataset.backup==="logout"){if(window.CRMAuth)CRMAuth.signOut()}else $("#importFile").click()});

/* confetti */
function confetti(n=140){
  const cv=$("#confetti"),ctx=cv.getContext("2d");cv.style.display="block";cv.width=innerWidth;cv.height=innerHeight;
  const ps=Array.from({length:n},()=>({x:innerWidth/2+(Math.random()-.5)*200,y:innerHeight*.35,vx:(Math.random()-.5)*14,vy:-Math.random()*12-4,s:Math.random()*7+4,r:Math.random()*6,c:COLORS[Math.floor(Math.random()*COLORS.length)],vr:(Math.random()-.5)*.3}));
  let f=0;(function step(){ctx.clearRect(0,0,cv.width,cv.height);ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);ctx.restore()});if(++f<130)requestAnimationFrame(step);else{ctx.clearRect(0,0,cv.width,cv.height);cv.style.display="none"}})();
}

$("#main").addEventListener("scroll",closeCtMenu);
/* boot */
(function(){const h=location.hash.slice(1);if((["accueil","clients","pipeline","relances","contrats"].includes(h)||/^p-(recherche|liste|appels|scripts|messages)$/.test(h)))state.view=h})();
init();
