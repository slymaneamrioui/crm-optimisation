<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://apis.google.com; connect-src 'self' https://*.googleapis.com https://*.gstatic.com wss://*.firebaseio.com; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; frame-src https://crm-optimisation-8d0cc.firebaseapp.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>Prospection Linkeo Québec</title>
<meta name="theme-color" content="#1f6fde">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Prospection">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%}[hidden]{display:none!important}
#login{position:fixed;inset:0;z-index:90;background:var(--bg);display:none;align-items:center;justify-content:center;padding:16px}
#login .lg-card{background:var(--card);border-radius:16px;box-shadow:var(--shadow);border:1px solid var(--line);padding:28px 22px;width:min(380px,100%);text-align:center}
#login h1{font-family:var(--display);font-size:26px;margin:0}
#login .f{text-align:left}#login input{font-size:16px;padding:11px 12px}

/* Layout : barre latérale + zone de travail (bureau), barre d'onglets en bas (téléphone). Bleu Linkeo, neutres teintés bleu. */
:root{
  --bg:#f2f5fa; --card:#ffffff; --ink:#14213a; --ink-2:#3d4a63; --ink-3:#6b7891; --line:#e1e7f0; --soft:#e7f0fc;
  --accent:#1f6fde; --accent-2:#1559bd; --on-accent:#ffffff;
  --ok:#1f8a4c; --ok-bg:#e3f4ea; --warn:#b86200; --warn-bg:#fff1dc; --bad:#c2312f; --bad-bg:#fde8e8; --violet:#6d4fd1; --violet-bg:#eee9fc; --grey:#64748b; --grey-bg:#eef1f5;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:10px; --shadow:0 1px 2px rgba(20,33,58,.06),0 2px 8px rgba(20,33,58,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1428; --card:#121f3b; --ink:#eaf0fb; --ink-2:#c2cde2; --ink-3:#8c9bb8; --line:#22355c; --soft:#16305e;
  --accent:#3b82f0; --accent-2:#5b98f5; --on-accent:#ffffff;
  --ok:#4ade80; --ok-bg:#12381f; --warn:#fbbf24; --warn-bg:#3a2a0b; --bad:#f87171; --bad-bg:#3a1418; --violet:#a78bfa; --violet-bg:#2a2150; --grey:#94a3b8; --grey-bg:#1b2944;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1428; --card:#121f3b; --ink:#eaf0fb; --ink-2:#c2cde2; --ink-3:#8c9bb8; --line:#22355c; --soft:#16305e;
  --accent:#3b82f0; --accent-2:#5b98f5; --on-accent:#ffffff;
  --ok:#4ade80; --ok-bg:#12381f; --warn:#fbbf24; --warn-bg:#3a2a0b; --bad:#f87171; --bad-bg:#3a1418; --violet:#a78bfa; --violet-bg:#2a2150; --grey:#94a3b8; --grey-bg:#1b2944;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--body);font-size:14px;color:var(--ink);background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:224px minmax(0,1fr);grid-template-rows:58px minmax(0,1fr);height:100%}
.top{grid-column:1/3;display:flex;align-items:center;gap:16px;padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--card);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;min-width:190px}
.logo-mark{background:var(--accent);color:var(--on-accent);border-radius:8px;padding:6px 10px;font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:.4px}
.logo small{font-family:var(--display);font-weight:700;font-size:13px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.6px}
.search{flex:1;max-width:560px;position:relative}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:8px;background:var(--bg);outline:none}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.sr{position:absolute;top:44px;left:0;right:0;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.15);max-height:380px;overflow:auto;z-index:30}
.sr-i{padding:10px 14px;display:flex;justify-content:space-between;gap:10px;cursor:pointer;border-bottom:1px solid var(--line)}
.sr-i:hover{background:var(--soft)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:14px}
.goal{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);background:none;border:0;padding:0}
.sync{font-size:12px;color:var(--ink-3);min-width:96px;text-align:right}
.nav{background:var(--card);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.nav button{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border:0;background:none;border-radius:8px;text-align:left;color:var(--ink-2);font-weight:500}
.nav button:hover{background:var(--bg)}
.nav button.on{background:var(--soft);color:var(--accent);font-weight:600}
.nav .ic{width:18px;text-align:center;font-family:var(--display);font-weight:800}
.nav .count{margin-left:auto;background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;font-weight:600}
.nav .sep{height:1px;background:var(--line);margin:10px 4px}
.nav .hint{font-size:12px;color:var(--ink-3);padding:6px 12px;line-height:1.5}
.main{overflow:auto;padding-block:22px 60px;padding-left:max(16px,26px);padding-right:max(16px,26px)}
.page-h{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.page-h h1{font-family:var(--display);font-weight:800;font-size:28px;margin:0;line-height:1.05;text-wrap:balance}
.sub{color:var(--ink-3);font-size:13px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:8px 14px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-2)}
.btn.ghost{border-color:transparent;background:none;color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.4;cursor:default}
.ml-auto{margin-left:auto}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:1px solid var(--line);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line);font-weight:600}
.card-b{padding:14px 16px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.kpi{padding:14px 16px}
.kpi .l{font-size:11px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.kpi .v{font-family:var(--display);font-size:34px;font-weight:800;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12px;color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
.row{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--soft)}
.row:last-child{border-bottom:0}
.av{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex:none}
.grow{flex:1;min-width:0}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.muted{color:var(--ink-3)} .small{font-size:12px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.s-nouveau{background:var(--soft);color:var(--accent)} .s-pas_repondu{background:var(--grey-bg);color:var(--grey)} .s-rappel{background:var(--warn-bg);color:var(--warn)}
.s-rdv{background:var(--ok-bg);color:var(--ok)} .s-refus{background:var(--bad-bg);color:var(--bad)} .s-hors_cible{background:var(--violet-bg);color:var(--violet)} .s-mauvais_num{background:var(--grey-bg);color:var(--ink-3)}
.tag{font-size:11px;font-weight:600;padding:2px 7px;border-radius:5px;white-space:nowrap}
.tag.late{background:var(--bad-bg);color:var(--bad)} .tag.today{background:var(--warn-bg);color:var(--warn)} .tag.soon{background:var(--soft);color:var(--accent)}
.empty{padding:28px 16px;text-align:center;color:var(--ink-3);line-height:1.5}
.empty b{color:var(--ink)}
.bar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--grey-bg);margin:6px 0 12px}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:12px;color:var(--ink-2)}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.sel{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:7px 9px;max-width:200px}
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse}
.t th{text-align:left;font-size:12px;color:var(--ink-3);font-weight:600;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--bg);white-space:nowrap}
.t th[data-sort]{cursor:pointer}
.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr.r{cursor:pointer}
.t tr.r:hover td{background:var(--soft)}
.t input[type=checkbox]{width:16px;height:16px}
.bulk{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:12px}
/* session d'appels */
.call-grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
.lead-card{padding:18px 20px}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--accent)}
.lead-name{font-family:var(--display);font-weight:800;font-size:36px;line-height:1.05;margin:8px 0 4px;text-wrap:balance}
.ask{color:var(--ink-2);margin:0 0 10px}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}
.fact{font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px;border:1px solid var(--line);background:var(--bg)}
.fact.red{background:var(--bad-bg);color:var(--bad);border-color:transparent} .fact.green{background:var(--ok-bg);color:var(--ok);border-color:transparent} .fact.amber{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.box{border-left:3px solid var(--accent);background:var(--bg);border-radius:6px;padding:10px 12px;line-height:1.5;margin-top:10px}
.box .lbl{display:block;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-3);margin-bottom:2px}
.phone{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:14px 0 4px}
.phone .num{font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:.5px;font-variant-numeric:tabular-nums;user-select:all}
.res-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.res{border:0;border-radius:10px;padding:14px 6px;font-family:var(--display);font-weight:800;font-size:20px;text-transform:uppercase;line-height:1.05}
.res span{display:block;font-family:var(--body);font-weight:500;font-size:11px;text-transform:none;opacity:.85;margin-top:2px}
.res.rdv{background:var(--ok);color:#fff} .res.rappel{background:#f59e0b;color:#111} .res.pas_repondu{background:var(--grey);color:#fff}
.res.refus{background:var(--bad);color:#fff} .res.hors_cible{background:var(--violet);color:#fff} .res.mauvais_num{background:var(--grey-bg);color:var(--ink-2);border:1px solid var(--line)}
.kbd{color:var(--ink-3);font-size:12px;margin-top:10px}
.kbd b{border:1px solid var(--line);border-radius:4px;padding:0 5px;margin:0 2px;color:var(--ink);font-weight:600}
.obj{border-bottom:1px solid var(--line)}
.obj:last-child{border-bottom:0}
.obj summary{cursor:pointer;padding:10px 16px;font-weight:600;list-style:none}
.obj summary::-webkit-details-marker{display:none}
.obj summary:before{content:"+ ";color:var(--accent);font-weight:700}
.obj[open] summary:before{content:"– "}
.obj p{margin:0;padding:0 16px 12px;line-height:1.5;color:var(--ink-2)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filters label{font-size:12px;color:var(--ink-3);font-weight:600}
.fbox{margin-bottom:12px}
.fbox summary{cursor:pointer;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:600;font-size:13px;color:var(--ink-2);list-style:none;margin-bottom:10px}
.fbox summary::-webkit-details-marker{display:none}
.fbox summary:before{content:"▸";color:var(--accent)}
.fbox[open] summary:before{content:"▾"}
/* fiche */
.rec-head{padding:18px 20px;display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap}
.rec-head .av{width:48px;height:48px;font-size:18px;border-radius:12px}
.rec-title{font-family:var(--display);font-weight:800;font-size:30px;margin:0;line-height:1.05}
.rec-layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;margin-top:16px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f.full{grid-column:1/-1}
.f label{font-size:12px;color:var(--ink-3);font-weight:500}
.f input,.f select,.f textarea{border:1px solid var(--line);border-radius:7px;padding:8px 10px;background:var(--card);outline:none;width:100%}
.f textarea{min-height:80px;resize:vertical}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
.sec-t{font-size:11px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;margin:18px 0 10px}
.sec-t:first-child{margin-top:0}
.tl{list-style:none;margin:0;padding:0}
.tl li{padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px;line-height:1.45}
.tl li:last-child{border-bottom:0}
.quick{display:flex;gap:6px;flex-wrap:wrap}
/* import */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:16px}
.step{padding:14px 16px}
.step b{font-family:var(--display);font-size:18px;display:block;margin-bottom:4px}
.step.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--soft)}
textarea.paste{width:100%;min-height:180px;border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--card);font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.map .f select{padding:7px 8px}
.map .ex{font-size:11px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prog{height:10px;background:var(--grey-bg);border-radius:99px;overflow:hidden;margin:10px 0}
.prog i{display:block;height:100%;background:var(--accent);transition:width .2s}
code{background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:12px}
/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(10,18,35,.5);display:flex;align-items:flex-start;justify-content:center;padding-top:8vh;z-index:50}
.modal{background:var(--card);border-radius:14px;width:min(560px,94vw);max-height:84vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-h{padding:16px 20px;border-bottom:1px solid var(--line);font-family:var(--display);font-weight:800;font-size:22px}
.modal-b{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.modal-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--card);padding:11px 18px;border-radius:10px;font-weight:500;z-index:60;max-width:92vw;text-align:center}
.banner{background:var(--warn-bg);color:var(--warn);padding:10px 14px;border-radius:10px;margin-bottom:14px;font-size:13px;font-weight:500}
.tabbar{display:none}
/* motivation */
.pts{display:flex;align-items:center;gap:8px;background:var(--warn-bg);color:var(--warn);border:0;border-radius:999px;padding:5px 12px 5px 6px;font-weight:700}
.pts .coin{width:24px;height:24px;border-radius:50%;background:#f5b301;color:#5a3c00;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:13px}
.pts small{font-weight:500;color:var(--ink-2)}
.hero-call{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:18px 20px;margin-bottom:16px;background:linear-gradient(120deg,var(--accent),var(--accent-2));color:var(--on-accent);border-radius:14px}
.hero-call .big{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.05}
.hero-call p{margin:4px 0 0;opacity:.9}
.hero-call .btn{background:#fff;color:#14213a;border-color:#fff;font-weight:700;font-size:16px;padding:12px 20px}
.lvl{height:8px;background:rgba(255,255,255,.3);border-radius:99px;overflow:hidden;margin-top:8px;max-width:340px}
.lvl i{display:block;height:100%;background:#ffd34d}
.cheer{position:fixed;left:50%;top:16%;transform:translateX(-50%);z-index:70;background:var(--card);border:2px solid var(--ok);border-radius:16px;padding:16px 22px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.25);max-width:92vw;animation:pop .35s ease-out}
.cheer b{display:block;font-family:var(--display);font-weight:800;font-size:34px;color:var(--ok)}
@keyframes pop{from{transform:translateX(-50%) scale(.8);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
.alarm{position:fixed;top:calc(66px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));z-index:65;background:var(--card);border:2px solid #f59e0b;border-radius:14px;padding:12px 14px;box-shadow:0 12px 34px rgba(0,0,0,.2);width:min(340px,calc(100vw - 32px));display:flex;flex-direction:column;gap:8px}
.alarm b{font-family:var(--display);font-size:20px}
.gifts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.gift{padding:16px;display:flex;flex-direction:column;gap:8px}
.gift .nm{font-weight:700;font-size:15px}
.gift .cost{font-family:var(--display);font-weight:800;font-size:26px;color:var(--warn)}
.gbar{height:8px;background:var(--grey-bg);border-radius:99px;overflow:hidden}.gbar i{display:block;height:100%;background:var(--ok)}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge-i{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;background:var(--bg);opacity:.45}
.badge-i.got{opacity:1;border-color:var(--ok);background:var(--ok-bg)}
.badge-i b{display:block;font-size:13px}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:80;width:100%;height:100%}
@media (max-width:760px){.pts small{display:none}.hero-call .big{font-size:24px}.hero-call .btn{width:100%}}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.grid2,.rec-layout,.call-grid{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-rows:56px minmax(0,1fr)}
  .top{grid-column:1;gap:10px}
  .nav,.sync,.logo small{display:none}
  .logo{min-width:auto}
  .goal span{display:none}
  .search input{font-size:16px;border-radius:999px}
  .sr{position:fixed;top:60px;left:8px;right:8px}
  .main{padding-block:14px calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .kpis{gap:10px}.kpi .v{font-size:28px}
  .toolbar{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
  .form,.steps{grid-template-columns:minmax(0,1fr)}
  .lead-name{font-size:30px}.phone .num{font-size:28px}
  .res-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.res{font-size:16px;padding:14px 4px}.res span{display:none}
  .kbd,.hide-m{display:none}
  .f input,.f select,.f textarea,.sel{font-size:16px}
  .scrim{align-items:flex-end;padding-top:0}
  .modal{width:100%;max-height:92vh;border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px));justify-content:space-around;align-items:flex-end}
  .tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink-3);padding:4px 6px;min-width:58px;position:relative}
  .tabbar .i{font-family:var(--display);font-weight:800;font-size:18px;line-height:1.1}
  .tabbar button.on{color:var(--accent)}
  .tabbar .fab{width:58px;height:58px;min-width:58px;border-radius:50%;background:var(--accent);color:var(--on-accent);justify-content:center;margin-top:-22px;box-shadow:0 6px 18px rgba(31,111,222,.35)}
  .tabbar .fab .i{font-size:15px}
  .tabbar .fab.on{color:var(--on-accent)}
  .filters label{display:none}
  .filters .sel{flex:1 1 140px;max-width:none}
  .tabbar .badge{position:absolute;top:0;right:8px;background:var(--bad);color:#fff;border-radius:999px;font-size:10px;padding:1px 6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="logo"><span class="logo-mark">Linkeo</span><small>Prospection QC</small></div>
    <div class="search">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="Entreprise, contact, ville, téléphone…" autocomplete="off" aria-label="Rechercher un lead">
      <div class="sr" id="sr" hidden></div>
    </div>
    <div class="top-r">
      <button class="pts" id="ptsBtn" data-v="cadeaux" title="Mes points et cadeaux"></button>
      <button class="goal" id="goal" title="Objectif d'appels du jour : clique pour le changer"></button>
      <div class="sync" id="sync"></div>
    </div>
  </header>
  <nav class="nav" id="nav">
    <button data-v="accueil"><span class="ic">◎</span>Accueil</button>
    <button data-v="appeler"><span class="ic">☏</span>Session d'appels</button>
    <button data-v="leads"><span class="ic">≡</span>Mes leads</button>
    <button data-v="rappels"><span class="ic">◷</span>Rappels et RDV <span class="count" id="navCount" hidden></span></button>
    <button data-v="contrats"><span class="ic">◫</span>Fins de contrat <span class="count" id="finCount" style="background:var(--warn)" hidden></span></button>
    <button data-v="cadeaux"><span class="ic">★</span>Points et cadeaux</button>
    <button data-v="import"><span class="ic">↧</span>Importer des leads</button>
    <div class="sep"></div>
    <div class="hint">En session : <b>1</b> RDV, <b>2</b> Rappel, <b>3</b> Pas répondu, <b>4</b> Refus, <b>5</b> Hors cible, <b>6</b> Mauvais no, <b>P</b> Passer, <b>Z</b> Annuler.</div>
  </nav>
  <main class="main" id="main"></main>
</div>
<nav class="tabbar" id="tabbar">
  <button data-v="accueil"><span class="i">◎</span>Accueil</button>
  <button data-v="leads"><span class="i">≡</span>Leads</button>
  <button class="fab" data-v="appeler" aria-label="Session d'appels"><span class="i">APPEL</span></button>
  <button data-v="rappels"><span class="i">◷</span>Rappels<span class="badge" id="tabCount" hidden></span></button>
  <button data-v="cadeaux"><span class="i">★</span>Cadeaux</button>
</nav>
<div id="modalRoot"></div>
<div id="cheerRoot"></div>
<div id="alarmRoot"></div>
<canvas id="confetti"></canvas>
<div class="toast" id="toast" hidden></div>
<script src="../config.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
